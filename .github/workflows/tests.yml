name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.13"
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.13"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-native.txt
            pyproject.toml
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt "setuptools>=77" wheel
      - name: Test Python fallback
        env:
          GVWZZ_NO_NATIVE: "1"
        run: python run_tests.py --quiet
      - name: Install native build dependencies
        run: python -m pip install -r requirements-native.txt
      - name: Build native extensions
        run: python build_native.py
      - name: Check native entry points
        run: python -m gvwzz doctor --require-native
      - name: Test native execution and reference agreement
        run: python run_tests.py --require-native --differential --quiet
